[theme]
base = "dark"
primaryColor = "#5b7cfa"
backgroundColor = "#0b0b0c"
secondaryBackgroundColor = "#161618"
textColor = "#ececee"
borderColor = "#26262b"
dataframeBorderColor = "#222226"
dataframeHeaderBackgroundColor = "#111113"
linkColor = "#9aabff"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap, sans-serif"
baseFontSize = 14
headingFontWeights = 600
baseRadius = "0.375rem"
buttonRadius = "0.375rem"
showWidgetBorder = true
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#9085e9"]

[server]
maxUploadSize = 500

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[browser]
gatherUsageStats = false
